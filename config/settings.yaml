# config/settings.yaml

# Cada rol admite opcionalmente think/temperature/keep_alive (ver models/ollama_model.py).
# Ausente = no se manda esa key en el payload, aplica el default de Ollama/el modelo.
# keep_alive controla cuánto tiempo Ollama retiene el modelo en VRAM tras la llamada:
# string de duración ("10m", "1h"), número de segundos, 0 (descargar apenas responde
# esta llamada) o negativo (mantenerlo cargado indefinidamente). Ningún rol lo fija hoy
# — esto solo habilita la key; decidir qué rol conviene configurar así queda para cuando
# haya un llamador real de OllamaModel.unload() (ver docs/plan-model-lifecycle-keep-alive.md).
roles:
  router:
    model_name: "phi3:mini" # Coincide con el tag real en `ollama list`
    capabilities: ["routing", "filtering"]
    priority: 1
    temperature: 0.0 # La clasificación debe ser estable para el mismo input, no creativa.
                      # Bajado tras observar en Fase 3 (schema grounding A/B) que la misma
                      # query caía en categorías distintas en corridas separadas con el
                      # default de Ollama (~0.8), rompiendo la comparabilidad WITH/WITHOUT.
                      # No elimina el ruido (greedy decoding igual puede variar con
                      # prompts ambiguos) pero lo reduce sustancialmente.

  manager:
    model_name: "gemma4:26b-a4b-it-qat"
    capabilities: ["orchestration", "task_management"]
    priority: 2

  architect:
    model_name: "qwen3.6:35b-a3b" # era qwen3.6:27b-q4_K_M (denso): 3/3 timeouts a 300s; este MoE completó el implementer en 123.1s
    capabilities: ["design", "reasoning"]
    priority: 3
    think: false # qwen3.6 es "thinking"-capable; el chain-of-thought completo excedía 300s por llamada

  implementer:
    model_name: "qwen3.6:35b-a3b"
    capabilities: ["coding", "implementation"]
    priority: 4
    think: false # mismo motivo que architect (también qwen3.6, también thinking-capable)

  qa_auditor:
    # era gemma3:27b (denso, 17GB): 157.8s en design_gate, el stage mas caro del
    # pipeline. Este es MoE (~4B activos de 26B) e instruction-tuned, que es lo que
    # QA necesita para respetar el formato VERDICT/FEEDBACK. Medido en el mismo run:
    # gemma4 hizo task_breakdown en 22.7s mientras gemma3 tardaba 157.8s.
    # Comparte tag con el manager: el pipeline baja de 4 modelos distintos a 3, y el
    # auditor sigue siendo independiente del architect/implementer, que es lo que
    # importa para que el gate valga algo.
    model_name: "gemma4:26b-a4b-it-qat"
    capabilities: ["verification", "compliance_check"]
    priority: 5

  copilot:
    model_name: "granite-code:8b"
    capabilities: ["autocomplete", "syntax"]
    priority: 6

embeddings:
  model_name: "nomic-embed-text:latest"
  dimension: 768 # Según metadata de ollama para nomic-embed-text
  max_chunk_chars: 3000 # límite real medido: /api/embeddings falla ~7700 chars (2048 tokens)
  batch_size: 16

ingestion:
  max_file_bytes: 1000000
  extensions: [".py", ".js", ".ts", ".md", ".sql", ".html", ".go"]
  ignored_dirs: ["node_modules", ".git", "__pycache__", "venv", ".venv", ".vector_store"]

retrieval:
  top_k: 5
  min_score: 0.0 # desactivado a propósito: calibrar con los scores logueados por consultas reales
  max_context_chars: 6000 # Techo REAL de todo el contexto ensamblado: bloque de schema +
                           # outline del Manager + reporte previo + chunks de RAG. Hasta el
                           # arreglo del presupuesto esto solo acotaba los chunks y el resto
                           # se concatenaba encima sin techo; el comentario viejo decía lo
                           # contrario de lo que el código hacía. Subido de 3000 porque ahora
                           # cubre bloques que antes no contaba, no porque entre más RAG.
                           # Ver core/orchestrator.py: _assemble_context.
  breakdown_reserve_chars: 1200 # Reserva para el outline del Manager, que todavía no existe
                                 # cuando se arma el contexto que el propio Manager lee. Sin
                                 # esto, el Architect perdería chunks que el Manager sí vio.
  max_chunks_per_source: 2 # evita que un solo archivo cope el top_k

# Contexto relacional determinista (opt-in por request: --schema-file).
# NO es RAG: el snapshot no se embebe, no se ingiere al vector store y no lleva score.
# El motor nunca abre una conexión ni guarda credenciales — el snapshot lo exporta el
# llamador. Ver docs/plan-schema-grounding.md.
schema_grounding:
  max_tables: 12 # tope de tablas renderizadas; el resto se lista por nombre como "existe
                  # pero no se muestra", que es mejor que omitirlas en silencio
  max_chars: 4000 # techo del bloque de schema solo; se descuenta de max_context_chars
  fk_expansion_depth: 1 # 1 a propósito: a profundidad 2 un esquema normalizado alcanza casi
                         # toda la base y "contexto seleccionado" vuelve a ser "todo"
  include_all_if_no_match: true # sin match léxico, mostrar todo el snapshot (si entra) en vez
                                 # de nada: una tabla de más cuesta presupuesto, una de menos
                                 # hace que el modelo la invente, y solo el segundo falla callado
  identifier_check: true # corre el verificador de conformidad determinista (sin modelo,
                          # docs/plan-schema-conformance.md) sobre la implementación final
                          # contra el snapshot. No gatea nada en modo `report` (el único
                          # modo construido hoy — `enforce` es C.7, diferido): el resultado
                          # queda en outcome.schema_grounding.conformance_check, recalculable
                          # por el llamador a partir de (implementación, snapshot). Reemplaza
                          # al check_identifiers() basado en regex — ver docs/fase3-decision.md
                          # para el diagnóstico de por qué ese instrumento era inutilizable.
  allow_new_objects: true # si NEW_OBJECT_DEFINED (una tabla/columna nueva que el propio
                           # output define) se reporta como violación. `true`: crear una
                           # tabla nueva es ingeniería legítima, no se marca. `false`: para
                           # un llamador con schema cerrado. Sin efecto operativo hasta que
                           # exista `enforce` (C.7, diferido) — hoy solo cambia qué aparece
                           # listado en el reporte. Ver docs/plan-schema-conformance.md §4.

storage:
  vector_db_path: "./memory/.vector_store"
  index_dir: "./memory/index"

pipeline:
  max_qa_iterations: 2 # Reintentos de QA -> rediseño antes de rendirse
  request_timeout_seconds: 300 # Modelos "thinking" (qwen3.6) + swap en frío pueden tardar minutos
  max_run_seconds: 1500 # Techo de la corrida COMPLETA de run_complex_task (no por llamada HTTP).
                         # Si se cumple, produce un recibo status:"timeout" con el trace parcial en
                         # vez de que el único recurso del llamador sea matar el proceso (perdiendo
                         # el recibo). Ver docs/plan-mitigation-fenix-outsourcing-controls.md paso A5.
                         # null/0 desactiva el cap. 1500s da margen sobre los ~24 min observados en
                         # COMPLEX_ARCHITECTURE real.
  closing_report: true # Manager compara el resultado final contra su propio outline inicial.
                        # Kill-switch para A/B el costo contra un baseline sin este stage.
                        # Ver docs/plan-macro-loop-manager-hitl.md (Fase 1).
  closing_report_max_implementation_chars: 8000 # el closing report es el prompt más grande
                                                 # del pipeline (goal+breakdown+plan+código) —
                                                 # trunca la implementación con marcador visible.
  max_macro_iterations: 1 # Fase 2: vueltas EXTRA del pipeline completo como máximo tras un
                           # closing_report con DEVIATION en UNEXPLAINED/UNKNOWN. El humano
                           # igual tiene que confirmar cada vuelta (main.py chat) — este es
                           # solo el tope duro. NOTA: el gate empírico del plan (correr 4
                           # queries reales y verificar que aparece ≥1 DROPPED genuino antes
                           # de construir esto) no se ejecutó — ver docs/plan-macro-loop-manager-hitl.md.
